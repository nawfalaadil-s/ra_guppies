  <path d="M78 50 C88 42, 98 48, 96 64 C94 78, 82 86, 68 88 C74 78, 76 64, 78 50 Z" fill="url(#coralGrad)" opacity="0.95" />
  <path d="M34 78 C24 88, 38 98, 52 94 C64 90, 72 82, 68 76 C55 80, 42 82, 34 78 Z" fill="url(#finGrad)" opacity="0.85" />
  <!-- Eye -->
  <circle cx="28" cy="46" r="3.5" fill="#FFFFFF" />
  <circle cx="27" cy="45" r="1.8" fill="#071326" />
  <circle cx="26.5" cy="44.5" r="0.6" fill="#FFFFFF" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="finGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0F264A" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Aquatic Fish Silhouette -->
  <path d="M78 50 C78 30, 60 16, 42 20 C28 23, 18 36, 15 48 C12 60, 20 74, 34 78 C52 83, 76 72, 78 50 Z" fill="url(#finGrad)" />
  <!-- Dynamic Flowing Fins -->
